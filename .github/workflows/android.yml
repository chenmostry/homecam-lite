name: Android

on:
  workflow_dispatch:
    inputs:
      accept_android_sdk_licenses:
        description: I have reviewed and accept the Android SDK licenses for this build.
        required: true
        default: false
        type: boolean

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    if: ${{ inputs.accept_android_sdk_licenses }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: ${{ inputs.accept_android_sdk_licenses }}
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android 35 SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Assemble and lint
        run: gradle -p android --no-daemon :app:assembleDebug :app:lintDebug
      - name: Verify debug APK signature
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: homecam-lite-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
